<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WEPADEL">
  <title>WEPADEL</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=3.5.1">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="loginScreen" class="screen login-screen">
    <div class="court-lines"></div>
    <div class="splash-brand">
      <img src="logo-wepadel-transparent.png" class="wepadel-logo" alt="WEPADEL">
    </div>
    <div class="login-content" id="loginPanel">
      <h2>Welkom bij WEPADEL</h2>
      <p class="muted">Log in om je speeldagen, uitslagen en statistieken te bekijken.</p>
      <form id="loginForm">
        <label>Gebruikersnaam<input id="loginUsername" autocomplete="username" autocapitalize="none" required></label>
        <label>Wachtwoord<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="btn primary full" type="submit">Inloggen</button>
      </form>
      <button class="text-button" id="showRegister" type="button">Nieuw account aanmaken</button>
    </div>
    <div class="login-content hidden" id="registerPanel">
      <h2>Account aanmaken</h2>
      <p class="muted">Na je aanmelding moet de beheerder je account eerst goedkeuren.</p>
      <form id="registerForm" class="register-form">
        <div class="form-grid compact-fields">
          <label>Voornaam<input name="first_name" autocomplete="given-name" required maxlength="40"></label>
          <label>Achternaam<input name="last_name" autocomplete="family-name" required maxlength="60"></label>
        </div>
        <label>Gebruikersnaam<input name="username" autocomplete="username" autocapitalize="none" minlength="3" maxlength="30" required></label>
        <label>Wachtwoord<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Wachtwoord herhalen<input name="password_repeat" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Competitiecode<input name="competition_code" autocomplete="off" minlength="6" required></label>
        <div id="registerAvatarPicker" class="registration-avatar-slot"></div>
        <button class="btn primary full" type="submit">Aanmelding versturen</button>
      </form>
      <button class="text-button" id="showLogin" type="button">Terug naar inloggen</button>
    </div>
    <div class="powered"><span>POWERED BY</span><img src="logo-gjmotion-white.png" alt="GJ MOTION"></div>
  </section>

  <section id="postLoginSplash" class="post-login-splash hidden" aria-hidden="true">
    <img src="logo-gjmotion-white.png" alt="GJ MOTION">
  </section>

  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <button id="backButton" class="icon-btn hidden" aria-label="Terug">‹</button>
      <div class="brand compact"><img src="logo-wepadel-transparent.png" alt="WEPADEL"></div>
    </header>
    <main id="mainContent" class="main-content"></main>
    <nav id="bottomNav" class="bottom-nav">
      <button data-page="dashboard" class="active"><span>⌂</span>Overzicht</button>
      <button data-page="playday"><span>▦</span>Speeldagen</button>
      <button data-page="history"><span>☰</span>Historie</button>
      <button data-page="ranking"><span>▥</span>Statistieken</button>
      <button data-page="account"><span>◎</span><b id="accountNavLabel">Account</b></button>
    </nav>
  </div>

  <div id="modalRoot"></div>

  <div id="scoreboardOverlay" class="scoreboard-overlay hidden" aria-hidden="true">
    <div class="scoreboard-topline">
      <span class="live-pill"><i></i> LIVE</span>
      <span id="xlTimer">00:00</span>
      <button id="exitScoreboard" class="score-icon-btn" aria-label="Sluiten">✕</button>
    </div>
    <div class="scoreboard-grid">
      <section class="score-team blue">
        <div id="xlBlueNames" class="xl-names">BLAUW</div>
        <div id="xlBluePoints" class="xl-points">0</div>
        <button id="xlBlueAdd" class="xl-hit" aria-label="Punt blauw">+</button>
      </section>
      <section class="score-center">
        <div class="score-label">GAMES</div>
        <div class="xl-games"><span id="xlBlueGames">0</span><b>—</b><span id="xlRedGames">0</span></div>
        <div id="xlServe" class="serve-pill">🎾 Blauw serveert</div>
      </section>
      <section class="score-team red">
        <div id="xlRedNames" class="xl-names">ROOD</div>
        <div id="xlRedPoints" class="xl-points">0</div>
        <button id="xlRedAdd" class="xl-hit" aria-label="Punt rood">+</button>
      </section>
    </div>
    <div id="xlControls" class="xl-controls">
      <button id="xlUndo" class="btn ghost">↶ Ongedaan</button>
      <button id="xlSpeak" class="btn ghost">🔊 Stand</button>
      <button id="xlVoice" class="btn ghost">🎙 Stem</button>
      <button id="xlServeToggle" class="btn ghost">🎾 Service</button>
      <button id="xlTimeOver" class="btn danger">⏱ Tijd voorbij</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=3.5.1"></script>
  <script src="scoring.js?v=3.5.1"></script>
  <script src="db.js?v=3.5.1"></script>
  <script src="app.js?v=3.5.1"></script>
</body>
</html>
